<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Explore Skills – SkillSwap</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/animations.css">
  <style>
    .explore-search-bar {
      display: flex;
      gap: 1rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }
    .search-input-wrapper {
      position: relative;
      flex: 1;
      min-width: 280px;
    }
    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
    }
    .search-input-wrapper input {
      padding-left: 2.75rem;
    }
    .category-pills-bar {
      display: flex;
      gap: 0.6rem;
      overflow-x: auto;
      padding-bottom: 1rem;
      margin-bottom: 2rem;
      scrollbar-width: thin;
    }
    .category-pill {
      background: rgba(22, 27, 43, 0.7);
      border: 1px solid var(--border-color);
      color: var(--text-secondary);
      padding: 0.45rem 1rem;
      border-radius: var(--radius-full);
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }
    .category-pill:hover, .category-pill.active {
      background: var(--accent-gradient);
      color: #fff;
      border-color: transparent;
      box-shadow: 0 4px 15px rgba(139, 92, 246, 0.3);
    }
    .skills-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.5rem;
    }
    .explore-skill-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 1.75rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: all 0.25s ease;
    }
    .explore-skill-card:hover {
      transform: translateY(-5px);
      border-color: var(--secondary-cyan);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5), 0 0 15px var(--secondary-cyan-glow);
    }
    .tag-chip {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-subtle);
      padding: 0.2rem 0.5rem;
      border-radius: var(--radius-sm);
      font-size: 0.75rem;
      color: var(--text-secondary);
    }
  </style>
</head>
<body class="page-fade-in">
  <!-- Dynamic Mount Point for Navbar -->
  <div id="navbar-mount"></div>

  <main class="container">
    <div class="reveal-on-scroll mb-3">
      <span class="badge badge-cyan mb-1"><i class="fas fa-compass"></i> Knowledge Directory</span>
      <h1>Explore Campus Skills</h1>
      <p>Search topics, view available mentors, and propose peer-to-peer reciprocal exchanges.</p>
    </div>

    <!-- Search and Filter Bar -->
    <div class="explore-search-bar reveal-on-scroll delay-1">
      <div class="search-input-wrapper">
        <i class="fas fa-search search-icon"></i>
        <input type="text" id="skill-search-input" class="form-control" placeholder="Search Python, Figma, Machine Learning, Web Dev, Algorithms...">
      </div>
      <div style="width: 220px;">
        <select id="format-filter" class="form-control">
          <option value="all">Any Format</option>
          <option value="online">Online Mentors</option>
          <option value="in-person">In-Person Mentors</option>
        </select>
      </div>
      <button onclick="handleSearch()" class="btn btn-primary"><i class="fas fa-filter"></i> Apply Filter</button>
    </div>

    <!-- Category Pills -->
    <div class="category-pills-bar reveal-on-scroll delay-2" id="categories-container">
      <button class="category-pill active" onclick="selectCategory('All', this)">All Disciplines</button>
      <button class="category-pill" onclick="selectCategory('Programming & Systems', this)">Programming & Systems</button>
      <button class="category-pill" onclick="selectCategory('Web & App Development', this)">Web & App Development</button>
      <button class="category-pill" onclick="selectCategory('Data Science & AI', this)">Data Science & AI</button>
      <button class="category-pill" onclick="selectCategory('UI/UX & Design', this)">UI/UX & Design</button>
      <button class="category-pill" onclick="selectCategory('Languages & Communication', this)">Languages & Communication</button>
    </div>

    <!-- Live Skills Grid -->
    <div class="skills-grid" id="explore-skills-container">
      <div class="skeleton" style="height: 220px;"></div>
      <div class="skeleton" style="height: 220px;"></div>
      <div class="skeleton" style="height: 220px;"></div>
    </div>
  </main>

  <!-- Exchange Request Modal from Explore Page -->
  <div class="modal-backdrop" id="explore-request-modal">
    <div class="modal-dialog">
      <div class="modal-header">
        <h3><i class="fas fa-paper-plane text-cyan"></i> Propose Skill Exchange</h3>
        <button class="modal-close" onclick="closeModal('explore-request-modal')">&times;</button>
      </div>
      <div class="modal-body">
        <form id="explore-request-form">
          <div class="form-group">
            <label class="form-label">Skill You Wish to Learn</label>
            <input type="text" id="req-modal-skill-learn" class="form-control" readonly style="background: rgba(10, 12, 20, 0.7);">
          </div>

          <div class="form-group">
            <label class="form-label" for="req-modal-mentor-select">Choose Mentor / Learning Partner</label>
            <select id="req-modal-mentor-select" class="form-control" required></select>
          </div>

          <div class="form-group">
            <label class="form-label" for="req-modal-my-offer">Skill You Offer in Return (Reciprocal Trade)</label>
            <select id="req-modal-my-offer" class="form-control" required></select>
          </div>

          <div class="form-group">
            <label class="form-label" for="req-modal-msg">Proposal Message</label>
            <textarea id="req-modal-msg" class="form-control" rows="3" placeholder="Explain your learning objective and how you'd like to collaborate..."></textarea>
          </div>

          <div class="modal-footer" style="padding: 0; margin-top: 1.5rem;">
            <button type="button" class="btn btn-secondary" onclick="closeModal('explore-request-modal')">Cancel</button>
            <button type="submit" class="btn btn-primary"><i class="fas fa-paper-plane"></i> Send Exchange Request</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Footer Mount -->
  <div id="footer-mount"></div>

  <!-- Scripts -->
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/explore.js"></script>
</body>
</html>
