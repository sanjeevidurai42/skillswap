<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notifications Center – SkillSwap</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/animations.css">
  <style>
    .notif-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 1.25rem 1.5rem;
      margin-bottom: 1rem;
      display: flex;
      align-items: flex-start;
      gap: 1.25rem;
      transition: all 0.2s ease;
      position: relative;
    }
    .notif-card.unread {
      background: rgba(22, 27, 43, 0.95);
      border-left: 4px solid var(--secondary-cyan);
    }
    .notif-icon-box {
      width: 44px;
      height: 44px;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      flex-shrink: 0;
    }
    .notif-unread-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--secondary-cyan);
      box-shadow: 0 0 8px var(--secondary-cyan-glow);
    }
  </style>
</head>
<body class="page-fade-in">
  <!-- Dynamic Mount Point for Navbar -->
  <div id="navbar-mount"></div>

  <main class="container" style="max-width: 850px;">
    <div class="flex items-center justify-between reveal-on-scroll mb-3" style="flex-wrap: wrap; gap: 1rem;">
      <div>
        <span class="badge badge-cyan mb-1"><i class="fas fa-bell"></i> Activity Feed</span>
        <h1>Notifications Center</h1>
        <p>Keep track of exchange requests, upcoming sessions, and skill points updates.</p>
      </div>
      <button onclick="markAllNotificationsAsRead()" class="btn btn-secondary btn-sm">
        <i class="fas fa-check-double"></i> Mark All as Read
      </button>
    </div>

    <!-- Filter Bar -->
    <div class="tabs-container reveal-on-scroll delay-1">
      <button class="tab-btn active" id="tab-all-notifs" onclick="filterNotifications('all')">
        All Notifications
      </button>
      <button class="tab-btn" id="tab-unread-notifs" onclick="filterNotifications('unread')">
        Unread Only (<span id="unread-count-pill">0</span>)
      </button>
    </div>

    <!-- Notifications List Container -->
    <div id="notifications-container">
      <div class="skeleton" style="height: 90px; margin-bottom: 10px;"></div>
      <div class="skeleton" style="height: 90px; margin-bottom: 10px;"></div>
      <div class="skeleton" style="height: 90px;"></div>
    </div>
  </main>

  <!-- Footer Mount -->
  <div id="footer-mount"></div>

  <!-- Scripts -->
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/notifications.js"></script>
</body>
</html>
